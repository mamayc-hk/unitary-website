<rect x="0" y="0" width="148.0" height="210.0" fill="#FFFFFF"/>
<text x="8.00" y="40.00" font-family="sans-serif" font-size="4.2" font-weight="bold" fill="#1B3A6B">掌握時刻 Take Time — 玩家速查卡（背面）</text>
<text x="8.00" y="45.00" font-family="sans-serif" font-size="2.2" font-weight="normal" fill="#8A8A8A">2–4 人 · 10+ · 30 分鐘 · 合作解謎 · 資料來源：官方規則書 (Libellud) · 免費下載 unitaryhk.com</text>
<text x="8.00" y="50.00" font-family="sans-serif" font-size="2.2" font-weight="normal" fill="#8A8A8A">雙面打印（長邊翻頁）→ 沿裁切線剪開 = 2 張雙面卡（每張 63 × 88 mm，可套 66×91 卡套）</text>
<g id="card">
<rect x="8.0" y="61.0" width="63.0" height="88.0" rx="1.5" fill="#FFFFFF" stroke="#D8D8D8" stroke-width="0.35"/>
