<!DOCTYPE html>
<html><head><title>JS test</title>
<style>
.box { padding: 12px; border: 1px solid #ccc; margin: 8px 0; }
.hidden { display: none; }
</style></head>
<body>
<h1>JS execution test</h1>
<p>JS status: <span id="js-status">pending</span></p>
<p>Click the button to toggle boxes:</p>
<button id="btn">Toggle boxes 2 & 3</button>
<div class="box">Box 1 (always visible)</div>
<div class="box" id="b2">Box 2 (toggle)</div>
<div class="box" id="b3">Box 3 (toggle)</div>
<div class="box">Box 4 (always visible)</div>

<script>
// Diagnostic 1: detect if JS is running
document.getElementById('js-status').textContent = 'JS executing';
document.getElementById('js-status').style.color = 'green';

// Diagnostic 2: setup toggle
document.getElementById('btn').addEventListener('click', function() {
  var b2 = document.getElementById('b2');
  var b3 = document.getElementById('b3');
  if (b2.style.display === 'none') {
    b2.style.display = '';
    b3.style.display = '';
  } else {
    b2.style.display = 'none';
    b3.style.display = 'none';
  }
});

// Diagnostic 3: also test getAttribute
var cards = document.querySelectorAll('.box');
document.getElementById('js-status').textContent = 'JS OK, found ' + cards.length + ' boxes';
</script>
</body></html>
