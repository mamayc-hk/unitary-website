<!DOCTYPE html>
<html><head><title>:has() test</title>
<style>
body { font-family: sans-serif; padding: 20px; }
input { margin-right: 8px; }
.has-test-output { padding: 12px; border: 2px solid #999; margin: 16px 0; min-height: 30px; }
body:has(#c1:checked) .test1 { background: yellow; }
body:has(#c2:checked) .test2 { background: lightgreen; }
</style></head>
<body>
<h1>:has() test</h1>
<p>Check a box and see if the corresponding test div changes color:</p>
<label><input type="checkbox" id="c1"> Test 1</label>
<label><input type="checkbox" id="c2"> Test 2</label>
<div class="has-test-output test1">Test 1: should turn yellow when c1 checked</div>
<div class="has-test-output test2">Test 2: should turn lightgreen when c2 checked</div>
</body></html>
